<main class="auth-shell">
  <section
    class="auth-panel"
    aria-labelledby="auth-title"
  >
    <header class="auth-header">
      <p class="eyebrow">
        SRMS / Account Access
      </p>

      <h1 id="auth-title">
        Restaurant portal
      </h1>

      <p>
        New public registrations create
        Student accounts.
      </p>
    </header>

    <nav
      class="view-switcher"
      aria-label="Authentication view"
    >
      <button
        type="button"
        [class.active]="
          activeView() === 'register'
        "
        (click)="setView('register')"
      >
        Registration
      </button>

      <button
        type="button"
        [class.active]="
          activeView() === 'login'
        "
        (click)="setView('login')"
      >
        Login
      </button>
    </nav>

    @if (serverMessage(); as message) {
      <p
        class="notice success"
        role="status"
      >
        {{ message }}
      </p>
    }

    @if (serverError(); as error) {
      <p
        class="notice error"
        role="alert"
      >
        {{ error }}
      </p>
    }

    @if (activeView() === 'register') {
      <form
        class="auth-form"
        (submit)="register($event)"
        novalidate
      >
        <label>
          Email
          <input
            type="email"
            autocomplete="email"
            [formField]="
              registrationForm.email
            "
          />
        </label>

        <label>
          Display name
          <input
            type="text"
            autocomplete="name"
            [formField]="
              registrationForm.displayName
            "
          />
        </label>

        <label>
          Georgian mobile number
          <input
            type="tel"
            placeholder="+995-5xx-xx-xx-xx"
            autocomplete="tel"
            [formField]="
              registrationForm.phone
            "
          />
        </label>

        <label>
          Password
          <input
            type="password"
            autocomplete="new-password"
            [formField]="
              registrationForm.password
            "
          />
        </label>

        <label>
          Confirm password
          <input
            type="password"
            autocomplete="new-password"
            [formField]="
              registrationForm.confirmPassword
            "
          />
        </label>

        <button
          class="primary-action"
          type="submit"
          [disabled]="
            registrationForm().submitting()
          "
        >
          @if (
            registrationForm().submitting()
          ) {
            Creating account...
          } @else {
            Register as Student
          }
        </button>
      </form>
    } @else {
      <form
        class="auth-form"
        (submit)="login($event)"
        novalidate
      >
        <label>
          Email
          <input
            type="email"
            autocomplete="email"
            [formField]="loginForm.email"
          />
        </label>

        <label>
          Password
          <input
            type="password"
            autocomplete="current-password"
            [formField]="loginForm.password"
          />
        </label>

        <button
          class="primary-action"
          type="submit"
          [disabled]="
            loginForm().submitting()
          "
        >
          @if (
            loginForm().submitting()
          ) {
            Signing in...
          } @else {
            Login
          }
        </button>
      </form>
    }
  </section>
</main>
